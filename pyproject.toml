[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxmethods"
version = "0.1.0"
description = "Eddy-covariance methods as plain functions: the estimators, without a program around them."
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENCE"]
requires-python = ">=3.9"
authors = [{name = "Pedro Henrique Coimbra", email = "pedro-henrique.herig-coimbra@inrae.fr"}]
keywords = ["eddy covariance", "flux", "micrometeorology", "methods"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# Only what the estimators themselves compute with. No plotting stack: the one
# diagnostic plot imports matplotlib where it is drawn.
dependencies = [
    "numpy>=1.24",
    "regorator>=0.2",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "xarray>=2023.1.0",
]

[tool.setuptools.packages.find]
include = ["fluxmethods*"]

# The sensor table is data the estimators read at run time, not documentation:
# without it `sensor_geometry` is empty and the analytic corrections that ask it
# for a path length raise. A wheel has to carry it.
[tool.setuptools.package-data]
"fluxmethods.spectral" = ["instruments/*.json", "instruments/*.md"]
